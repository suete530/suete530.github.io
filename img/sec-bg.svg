<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="130"/>
    </filter>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="52%" stop-color="#070a0f"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <radialGradient id="fade" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".75"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#base)"/>
  <g filter="url(#soft)">
    <circle cx="120" cy="60" r="330" fill="#1d4ed8" opacity=".50"/>
    <circle cx="1480" cy="140" r="300" fill="#7c3aed" opacity=".38"/>
    <circle cx="1240" cy="860" r="360" fill="#0f9d76" opacity=".34"/>
    <circle cx="380" cy="820" r="300" fill="#b45309" opacity=".22"/>
    <circle cx="760" cy="380" r="260" fill="#0284c7" opacity=".18"/>
  </g>
  <rect width="1600" height="900" fill="url(#fade)"/>
</svg>
